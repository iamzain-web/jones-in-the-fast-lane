<!DOCTYPE html>
<html>

<head>
    <title>Jones.App.Browser</title>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover reaches under a phone's rounded corners and notch; without
         user-scalable=no a stray pinch zooms the canvas and there is no way back, because
         the game owns every pointer gesture inside it. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <!-- Tells Android Chrome to colour its chrome to match, so the seam is less obvious
         in the moments before fullscreen is entered. -->
    <meta name="theme-color" content="#101010">
    <link rel="stylesheet" href="./app.css" />
    <style>
        /* THE FULLSCREEN BUTTON.

           On a phone the address bar and the system bars take a third of a short screen,
           and the board is 320x200 - it is the widest thing in the game and it loses
           first. The Fullscreen API is the only thing that actually removes browser
           chrome; a CSS trick cannot.

           It is HTML rather than part of the game deliberately. requestFullscreen must be
           called from a real user gesture on the document, and it is the PAGE being made
           fullscreen, not anything the game knows about - the same reason the sound
           switches live outside the game's 320x200 space rather than in it.

           Hidden while fullscreen: the way out is the phone's own back gesture, which is
           what a player will reach for anyway. */
        #fs {
            position: fixed; right: max(10px, env(safe-area-inset-right));
            bottom: max(10px, env(safe-area-inset-bottom));
            width: 44px; height: 44px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            border: 0; border-radius: 8px;
            background: #99000000; background: rgba(0, 0, 0, .6);
            color: #f0f0f0; cursor: pointer; z-index: 2147483647;
            -webkit-tap-highlight-color: transparent;
        }
        #fs:active { background: rgba(255, 255, 255, .25); }
        #fs svg { width: 24px; height: 24px; display: block; }
        /* Gone in fullscreen, and gone where the API is not offered at all - an inert
           button is worse than no button. */
        :fullscreen #fs, #fs[hidden] { display: none; }

        /* THE AD SLOT.
           Top left, below the menu bar so it never sits on Game/Options/Status, and small
           enough to leave the board alone. It is page furniture, not part of the game:
           Avalonia owns the canvas and this sits above it, so nothing in the port had to
           learn about advertising. */
        #ad {
            position: fixed; left: 10px; top: 46px; z-index: 9;
            display: none;                  /* nothing to show unless one is configured */
            max-width: 300px;
            padding: 6px 24px 6px 8px;
            background: rgba(16, 16, 16, .72);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 6px;
            font: 12px/1.35 system-ui, sans-serif;
            color: #d8d8d8;
            backdrop-filter: blur(2px);
            transition: opacity .35s ease;
        }
        #ad.show { display: block; }
        #ad.fade { opacity: 0; }
        /* Only the card takes clicks; the board underneath keeps every pixel it had. */
        #ad, #ad * { pointer-events: auto; }
        #ad-close {
            position: absolute; top: 2px; right: 4px;
            background: none; border: 0; cursor: pointer;
            color: #9a9a9a; font-size: 15px; line-height: 1; padding: 2px 4px;
        }
        #ad-close:hover { color: #fff; }
        /* A phone has no room for a 300px card beside a 320px game. */
        @media (max-width: 560px) { #ad { max-width: 170px; font-size: 11px; } }

        /* The loading screen. Black, because the game's own letterbox is black and the
           handover should not flash. */
        #boot {
            position: fixed; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            background: #000;
            transition: opacity .35s ease;
        }
        #boot.gone { opacity: 0; pointer-events: none; }

        /* Three blocks, stepping. No words: every string this game shows comes from its
           own resources, and a loading screen is no reason to start inventing them. */
        .boot-mark { display: flex; gap: 7px; }
        .boot-mark span {
            width: 13px; height: 13px; background: #6ec6d8;
            animation: boot-step 1.05s ease-in-out infinite;
        }
        .boot-mark span:nth-child(2) { animation-delay: .14s; }
        .boot-mark span:nth-child(3) { animation-delay: .28s; }
        @keyframes boot-step {
            0%, 70%, 100% { opacity: .22; transform: translateY(0); }
            35%           { opacity: 1;   transform: translateY(-7px); }
        }
        /* Someone who has asked not to be moved gets the same cue without the motion. */
        @media (prefers-reduced-motion: reduce) {
            .boot-mark span { animation-name: boot-fade; }
            @keyframes boot-fade { 0%,70%,100% { opacity: .22 } 35% { opacity: 1 } }
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden">
<div id="out"></div>

<!-- THE LOADING SCREEN, AND IT IS NOT JUST A LOGO SWAP.

     It replaces "Powered by Avalonia", which is a credit for the toolkit rather than
     anything to do with this game. It also sits OUTSIDE #out, which the old one did not:
     Avalonia empties #out when it starts, so the old splash vanished the moment the
     RENDERER was ready - which is ten seconds before the GAME is. In that gap the town
     drew from the 838 1x cels compiled into the assembly, so Sierra's 1990 board appeared
     and was then replaced by ours. C# takes this away instead, once the real art has
     landed; see jonesReady in main.js. -->
<!-- THE AD SLOT. Empty by default, and INVISIBLE when empty - a player never sees a
     placeholder. Paste the network's tag inside #ad-body (an AdSense <ins>, an image and
     a link, whatever it is) and it appears once per run. `?adpreview=1` shows the outline
     without a tag, for positioning. -->
<div id="ad">
    <button id="ad-close" title="Close" aria-label="Close">&times;</button>
    <div id="ad-body"><!-- ad tag goes here --></div>
</div>

<div id="boot">
    <div class="boot-mark"><span></span><span></span><span></span></div>
</div>
</div>
<button id="fs" hidden title="Fullscreen" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9V4h5M21 9V4h-5M3 15v5h5M21 15v5h-5"/>
    </svg>
</button>
<script>
    // Shown only where it can work. iOS on a phone does not offer requestFullscreen on an
    // element at all, so on an iPhone this button correctly never appears rather than
    // appearing and doing nothing.
    (function () {
        var b = document.getElementById('fs');
        var el = document.documentElement;
        if (!(el.requestFullscreen || el.webkitRequestFullscreen)) return;
        b.hidden = false;

        b.addEventListener('click', function () {
            var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el,
                     { navigationUI: 'hide' });
            // A rejected promise is normal - an unsupported option, a policy, a gesture
            // the browser did not credit - and must not reach the console as an error.
            if (p && p.catch) p.catch(function () { });

            // THE BOARD IS 320x200 AND A PHONE IS HELD TALL. Landscape is the orientation
            // this game has, so ask for it once we are fullscreen, which is the only state
            // in which a browser will grant a lock. Entirely optional: it throws on
            // desktop and on anything that declines, and nothing depends on it.
            try {
                var o = screen.orientation;
                if (o && o.lock) { var q = o.lock('landscape'); if (q && q.catch) q.catch(function () { }); }
            } catch (e) { }
        });
    })();
</script>
<!-- IMPORTED WITH A CACHE-BUSTING QUERY RATHER THAN LINKED DIRECTLY, and it is a real bug
     this prevents rather than a precaution.

     Everything under _framework carries a content hash in its NAME, so a new build is a new
     URL and no browser can serve a stale one. `main.js` does not: it keeps its name forever,
     GitHub Pages serves it with a ten-minute max-age, and a returning player therefore runs
     the PREVIOUS loader against the CURRENT runtime. That is not theoretical - it happened
     here: main.js grew the storage and loading-screen hooks, the page kept serving the 436-
     byte version that had neither, and the game sat behind a loading screen that nothing
     could take down while the console showed no error at all, because nothing had failed.

     Two kilobytes re-fetched per load buys the guarantee that the loader always matches the
     build. The runtime it pulls in is still content-hashed and still cached. -->
<script type="module">
    import('./main.js?v=' + Date.now());
</script>
</body>

</html>
